<template>
  <div class="slds-p-horizontal_medium slds-p-top_small">
    <ui-page-header
      variant="object-home"
      icon-name="standard:instore_actions"
      object-label="Research Studies"
      title={currentViewLabel}
      meta-text={metaText}
      onsearch={handleSearch}>
      <ui-list-view-picker
        slot="switcher"
        views={views}
        current-view={view}
        onviewchange={handleViewChange}>
      </ui-list-view-picker>
      <div slot="actions">
        <div class="slds-page-header__controls">
          <div class="slds-page-header__control">
            <lightning-button-group>
              <lightning-button label="New" variant="neutral"></lightning-button>
              <lightning-button label="Import" variant="neutral"></lightning-button>
            </lightning-button-group>
          </div>
        </div>
      </div>
    </ui-page-header>

    <ui-annotation-chip
      type="integration"
      heading="Trial intake: Citeline / ClinicalTrials.gov via MuleSoft"
      detail="single API, up to two MuleSoft flows, up to three Salesforce objects. Customer responsible for licensing and API tokens (Citeline, ClinicalTrials.gov).">
    </ui-annotation-chip>

    <lightning-datatable
      key-field="id"
      data={filtered}
      columns={columns}
      onrowaction={handleRowAction}
      hide-checkbox-column
      show-row-number-column>
    </lightning-datatable>
  </div>
</template>
