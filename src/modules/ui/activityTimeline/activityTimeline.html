<template>
  <template lwc:if={hasItems}>
    <ul class="slds-timeline">
      <template for:each={rows} for:item="item">
        <li key={item.key} class="slds-timeline__item slds-p-vertical_x-small">
          <div class="slds-media">
            <div class="slds-media__figure">
              <lightning-icon icon-name={item.iconName} size="small" alternative-text="Activity"></lightning-icon>
            </div>
            <div class="slds-media__body">
              <div class="slds-grid slds-grid_align-spread">
                <p class="slds-truncate slds-text-body_regular"><strong>{item.subject}</strong></p>
                <p class="slds-text-body_small slds-text-color_weak slds-no-flex slds-m-left_small">{item.date}</p>
              </div>
              <template lwc:if={item.description}>
                <p class="slds-text-body_small slds-m-top_xxx-small">{item.description}</p>
              </template>
              <template lwc:if={item.hasStatus}>
                <lightning-badge label={item.status} class="slds-m-top_xxx-small"></lightning-badge>
              </template>
            </div>
          </div>
        </li>
      </template>
    </ul>
  </template>
  <template lwc:else>
    <div class="slds-p-around_medium slds-text-color_weak slds-text-body_small">{emptyText}</div>
  </template>
</template>
