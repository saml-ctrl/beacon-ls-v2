<template>
  <div class="slds-m-bottom_medium">
    <template lwc:if={title}>
      <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small slds-text-title_caps slds-m-bottom_x-small">
        <span class="slds-truncate" title={title}>{title}</span>
      </h3>
    </template>
    <div class="slds-grid slds-wrap slds-gutters_small slds-p-horizontal_x-small">
      <template for:each={computedFields} for:item="field">
        <div key={field.key} class={field.colClass}>
          <template lwc:if={field.isTextarea}>
            <lightning-textarea label={field.label} value={field.value} read-only></lightning-textarea>
          </template>
          <template lwc:if={field.isInput}>
            <lightning-input label={field.label} value={field.value} type={field.type} read-only></lightning-input>
          </template>
        </div>
      </template>
    </div>
  </div>
</template>
